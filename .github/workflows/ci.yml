name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Both platforms on purpose: the CLI crash this suite regression-tests was a
    # Windows console-codepage bug that a Linux-only matrix would never have caught.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Core + dev only. torch lives in the `embed` extra, so CI never pulls the
      # ~2.6 GB CUDA wheel it has no audio to run through anyway.
      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        # The benchmark regression tests self-skip: they need
        # data/processed/dataset.parquet, which is regenerable from the public APIs
        # and therefore not in the repo.
        run: pytest -q
