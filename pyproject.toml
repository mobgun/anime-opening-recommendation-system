[project]
name = "anime-themes-recsys"
version = "0.1.0"
description = "Anime OP/ED recommender: joins MyAnimeList metadata with AnimeThemes audio, embeds it with MERT, and evaluates the ranking against independent ground truths."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "tenacity>=9.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "numpy>=1.26",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "transformers>=4.40",
    "torch>=2.2",
    "torchaudio>=2.2",
    "librosa>=0.10",
    "soundfile>=0.12",
]

[project.scripts]
animethemes-pipeline = "src.pipeline:main"
animethemes-recommend = "src.recommend:main"
animethemes-evaluate = "src.evaluate:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
