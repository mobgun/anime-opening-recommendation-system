[project]
name = "anime-themes-recsys"
version = "0.1.0"
description = "Anime OP/ED recommender: joins MyAnimeList metadata with AnimeThemes audio, embeds it with MERT, and evaluates the ranking against independent ground truths."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

# Core: fetching, joining, ranking and evaluating. Deliberately excludes torch —
# producing embeddings needs a 2.6 GB CUDA wheel, reading them back does not, so
# `pip install -e .` is enough to run the recommender on a prebuilt dataset.
dependencies = [
    "httpx>=0.27",
    "tenacity>=9.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "numpy>=1.26",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Stage 4 only. See the README's GPU note before installing torch on Windows.
embed = [
    "transformers>=4.40",
    "torch>=2.2",
    "torchaudio>=2.2",
    "librosa>=0.10",
    "soundfile>=0.12",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
animethemes-pipeline = "src.pipeline:main"
animethemes-recommend = "src.recommend:main"
animethemes-evaluate = "src.evaluate:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "corpus: needs data/processed/dataset.parquet; skipped when it is absent",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B905: this codebase uses the sliding-window idiom `zip(xs, xs[1:])`, where
# unequal lengths are the point, and its lockstep zips are over lists appended
# together in one loop. `strict=` would be 16 keyword arguments guarding nothing.
ignore = ["B905"]
